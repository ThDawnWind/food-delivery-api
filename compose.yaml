services:
  postgres:
    image: postgres:18.6-alpine
    container_name: food-delivery-postgres

    environment:
      POSTGRES_DB: food_delivery
      POSTGRES_USER: food_delivery
      POSTGRES_PASSWORD: food_delivery

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql
  postgres-test:
    image: postgres:18.6-alpine
    container_name: food-delivery-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_DB: food_delivery_test
      POSTGRES_USER: food_delivery
      POSTGRES_PASSWORD: food_delivery
    ports:
      - "55432:5432"

volumes:
  postgres-data:
