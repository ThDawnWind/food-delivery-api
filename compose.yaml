services:
  postgres:
    image: postgres:18.6-alpine
    container_name: food-delivery-postgres

    environment:
      POSTGRES_DB: food_delivery
      POSTGRES_USER: food_delivery
      POSTGRES_PASSWORD: food_delivery

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_delivery -d food_delivery"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile

    image: food-delivery-api:local
    container_name: food-delivery-migrate

    env_file:
      - .env

    environment:
      DATABASE_URL: postgres://food_delivery:food_delivery@postgres:5432/food_delivery?sslmode=disable

    depends_on:
      postgres:
        condition: service_healthy

    command: ["./migrate", "up"]

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: food-delivery-api:local
    container_name: food-delivery-api

    env_file:
      - .env

    environment:
      DATABASE_URL: postgres://food_delivery:food_delivery@postgres:5432/food_delivery?sslmode=disable
      HTTP_PORT: 8080

    ports:
      - "8080:8080"

    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres-test:
    image: postgres:18.6-alpine
    container_name: food-delivery-postgres-test

    profiles:
      - test

    environment:
      POSTGRES_DB: food_delivery_test
      POSTGRES_USER: food_delivery
      POSTGRES_PASSWORD: food_delivery

    ports:
      - "55432:5432"

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "127.0.0.1:19092:19092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    volumes:
      - kafka-data:/var/lib/kafka/data

  
  order-consumer:
    build:
      context: .
      dockerfile: Dockerfile

    image: food-delivery-api:local

    env_file:
      - .env

    environment:
      DATABASE_URL: postgres://food_delivery:food_delivery@postgres:5432/food_delivery?sslmode=disable
      KAFKA_BROKER: kafka:9092

    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started

    command: ["./order-consumer"]

    stop_grace_period: 60s

  outbox-relay:
    build:
      context: .
      dockerfile: Dockerfile

    image: food-delivery-api:local

    env_file:
      - .env

    environment:
      DATABASE_URL: postgres://food_delivery:food_delivery@postgres:5432/food_delivery?sslmode=disable
      KAFKA_BROKER: kafka:9092

    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started

    command: ["./outbox-relay"]

    stop_grace_period: 60s

volumes:
  postgres-data:
  kafka-data:
