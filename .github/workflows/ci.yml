name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine

        env:
          POSTGRES_DB: food_delivery_test
          POSTGRES_USER: food_delivery
          POSTGRES_PASSWORD: food_delivery

        ports:
          - 55432:5432

        options: >-
          --health-cmd "pg_isready -U food_delivery -d food_delivery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test

      DATABASE_URL: postgres://food_delivery:food_delivery@localhost:55432/food_delivery_test?sslmode=disable
      TEST_DATABASE_URL: postgres://food_delivery:food_delivery@localhost:55432/food_delivery_test?sslmode=disable

      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
      JWT_TTL: 24h

      APP_TIMEZONE: UTC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: go.sum

      - name: Show Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"

          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run database migrations
        run: go run ./cmd/migrate up

      - name: Run tests
        run: go test -count=1 ./...
